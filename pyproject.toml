[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coupon-anomaly-autoencoder"
version = "0.1.0"
description = "Reproducible, synthetic-data autoencoder benchmark for coupon-terminal anomalies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2", "matplotlib>=3.8,<4"]

[project.scripts]
coupon-ae = "coupon_autoencoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
